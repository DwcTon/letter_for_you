        /* ==========================================================================
           6. HIỆU ỨNG HẠT LẤP LÁNH & TRÁI TIM TRÔI NHẸ NỀN
           ========================================================================== */
        const AmbientFX = (() => {
            const canvas = document.getElementById('ambient-canvas');
            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            let particles = [];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            function createParticle() {
                const isHeart = Math.random() < 0.25;
                return {
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: isHeart ? (8 + Math.random() * 8) : (2 + Math.random() * 3.5),
                    speedY: -(0.18 + Math.random() * 0.35),
                    speedX: (Math.random() - 0.5) * 0.25,
                    alpha: 0.15 + Math.random() * 0.35,
                    isHeart,
                    swayOffset: Math.random() * Math.PI * 2,
                    swaySpeed: 0.008 + Math.random() * 0.012
                };
            }

            function drawHeart(x, y, size, alpha) {
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                const topCurveHeight = size * 0.3;
                ctx.moveTo(0, topCurveHeight);
                ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
                ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.5, 0, size);
                ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.5, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
                ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();
                ctx.fillStyle = `rgba(200, 125, 135, ${alpha})`;
                ctx.fill();
                ctx.restore();
            }

            function init() {
                resize();
                window.addEventListener('resize', resize);

                const count = AppState.reducedMotion ? 10 : Math.min(28, Math.floor((width * height) / 38000));
                particles = Array.from({ length: count }, createParticle);

                if (!AppState.reducedMotion) {
                    loop();
                } else {
                    renderFrame();
                }
            }

            function renderFrame() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach((p) => {
                    p.swayOffset += p.swaySpeed;
                    p.y += p.speedY;
                    p.x += p.speedX + Math.sin(p.swayOffset) * 0.2;

                    if (p.y < -20) {
                        p.y = height + 20;
                        p.x = Math.random() * width;
                    }
                    if (p.x < -20) p.x = width + 20;
                    if (p.x > width + 20) p.x = -20;

                    if (p.isHeart) {
                        drawHeart(p.x, p.y, p.size, p.alpha * 0.75);
                    } else {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(218, 165, 172, ${p.alpha})`;
                        ctx.fill();
                    }
                });
            }

            function loop() {
                renderFrame();
                requestAnimationFrame(loop);
            }

            return { init };
        })();

        /* ==========================================================================
           7. HIỆU ỨNG PHÁO GIẤY & TRÁI TIM BAY LÊN MÀN HÌNH ĂN MỪNG
           ========================================================================== */
        const CelebrationFX = (() => {
            const canvas = document.getElementById('celebration-canvas');
            const ctx = canvas.getContext('2d');
            let width = 0;
            let height = 0;
            let items = [];
            let running = false;

            const palette = ['#C87D87', '#A8424D', '#E8C5C8', '#F3E5D8', '#D4AF37', '#F4A6B0'];

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            function createConfettiBurst() {
                const burstCount = AppState.reducedMotion ? 20 : 85;
                for (let i = 0; i < burstCount; i++) {
                    items.push({
                        type: Math.random() < 0.45 ? 'heart' : 'confetti',
                        x: width / 2 + (Math.random() - 0.5) * 180,
                        y: height * 0.55,
                        vx: (Math.random() - 0.5) * 11,
                        vy: -(5 + Math.random() * 9),
                        gravity: 0.14 + Math.random() * 0.06,
                        size: 7 + Math.random() * 9,
                        color: palette[Math.floor(Math.random() * palette.length)],
                        rotation: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() - 0.5) * 0.12,
                        alpha: 1
                    });
                }
            }

            function spawnRisingHeart() {
                items.push({
                    type: 'rising-heart',
                    x: Math.random() * width,
                    y: height + 25,
                    vx: (Math.random() - 0.5) * 0.6,
                    vy: -(1.1 + Math.random() * 1.6),
                    size: 10 + Math.random() * 14,
                    color: palette[Math.floor(Math.random() * 4)],
                    sway: Math.random() * Math.PI * 2,
                    alpha: 0.75 + Math.random() * 0.25
                });
            }

            function drawHeartShape(x, y, size, color, alpha) {
                ctx.save();
                ctx.translate(x, y);
                ctx.globalAlpha = Math.max(0, alpha);
                ctx.beginPath();
                const topCurveHeight = size * 0.3;
                ctx.moveTo(0, topCurveHeight);
                ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
                ctx.bezierCurveTo(-size / 2, (size + topCurveHeight) / 2, 0, (size + topCurveHeight) / 1.5, 0, size);
                ctx.bezierCurveTo(0, (size + topCurveHeight) / 1.5, size / 2, (size + topCurveHeight) / 2, size / 2, topCurveHeight);
                ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.restore();
            }

            function loop() {
                if (!running) return;
                ctx.clearRect(0, 0, width, height);

                if (!AppState.reducedMotion && Math.random() < 0.18 && items.length < 130) {
                    spawnRisingHeart();
                }

                for (let i = items.length - 1; i >= 0; i--) {
                    const it = items[i];
                    if (it.type === 'rising-heart') {
                        it.sway += 0.02;
                        it.x += it.vx + Math.sin(it.sway) * 0.5;
                        it.y += it.vy;
                        if (it.y < -30) {
                            items.splice(i, 1);
                            continue;
                        }
                        drawHeartShape(it.x, it.y, it.size, it.color, it.alpha);
                    } else {
                        it.x += it.vx;
                        it.y += it.vy;
                        it.vy += it.gravity;
                        it.vx *= 0.99;
                        it.rotation += it.rotationSpeed;
                        if (it.y > height * 0.78) {
                            it.alpha -= 0.018;
                        }

                        if (it.y > height + 40 || it.alpha <= 0) {
                            items.splice(i, 1);
                            continue;
                        }

                        if (it.type === 'heart') {
                            drawHeartShape(it.x, it.y, it.size, it.color, it.alpha);
                        } else {
                            ctx.save();
                            ctx.translate(it.x, it.y);
                            ctx.rotate(it.rotation);
                            ctx.globalAlpha = Math.max(0, it.alpha);
                            ctx.fillStyle = it.color;
                            ctx.fillRect(-it.size / 2, -it.size / 4, it.size, it.size / 2);
                            ctx.restore();
                        }
                    }
                }

                requestAnimationFrame(loop);
            }

            function start() {
                resize();
                window.addEventListener('resize', resize);
                running = true;
                createConfettiBurst();
                loop();
            }

            return { start };
        })();

        /* ==========================================================================
           8. BỘ ĐIỀU KHIỂN NHẠC NỀN ĐA GIAI ĐOẠN (MULTI-STAGE AUDIO CONTROLLER)
           Hỗ trợ cả file MP3 riêng cho từng giai đoạn (có crossfade âm lượng)
           LẪN bộ tạo giai điệu Web Audio API tự động nếu không có file MP3.
           ========================================================================== */
        /* ==========================================================================
           8. BỘ ĐIỀU KHIỂN NHẠC NỀN ĐA GIAI ĐOẠN (ĐÃ ĐỒNG BỘ MP3 & START TIME)
           ========================================================================== */
        const SoundController = (() => {
            let playing = false;
            let currentStage = 'reading'; // 'reading' | 'celebration'
            let audioCtx = null;
            let synthTimer = null;
            let noteStep = 0;
            let toastTimer = null;
            let fadeInterval = null;

            const bgAudio = new Audio();
            bgAudio.loop = true;

            const readingMelody = [
                { f: 349.23, d: 1.6 }, { f: 440.00, d: 1.5 }, { f: 523.25, d: 1.7 }, { f: 659.25, d: 2.0 },
                { f: 587.33, d: 1.6 }, { f: 523.25, d: 1.5 }, { f: 440.00, d: 1.8 }, { f: 392.00, d: 2.0 }
            ];

            const celebrationMelody = [
                { f: 523.25, d: 1.1 }, { f: 659.25, d: 1.1 }, { f: 783.99, d: 1.2 }, { f: 1046.50, d: 1.5 },
                { f: 880.00, d: 1.1 }, { f: 1046.50, d: 1.3 }, { f: 783.99, d: 1.4 }, { f: 659.25, d: 1.2 }
            ];

            function initAudioContext() {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (AudioContextClass) audioCtx = new AudioContextClass();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function playSynthNote(freq, duration = 1.5, volume = 0.045, type = 'sine') {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);

                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(volume, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + duration + 0.06);
            }

            function stopSynthLoop() {
                if (synthTimer) {
                    clearInterval(synthTimer);
                    synthTimer = null;
                }
            }

            function startSynthLoop(stage) {
                stopSynthLoop();
                initAudioContext();
                if (!audioCtx) return;

                const isCelebration = stage === 'celebration';
                const sequence = isCelebration ? celebrationMelody : readingMelody;
                const intervalMs = isCelebration ? 430 : 720;
                const toneVolume = isCelebration ? 0.055 : 0.04;

                const playStep = () => {
                    if (!playing) return;
                    const item = sequence[noteStep % sequence.length];
                    playSynthNote(item.f, item.d, toneVolume, 'sine');
                    if (noteStep % 4 === 0) {
                        playSynthNote(item.f / 2, item.d * 1.2, toneVolume * 0.45, 'triangle');
                    }
                    noteStep++;
                };

                playStep();
                synthTimer = setInterval(playStep, intervalMs);
            }

            function setAudioStartTime(audioElement, startTime) {
                const applyTime = () => {
                    if (startTime >= 0 && (!audioElement.duration || startTime < audioElement.duration)) {
                        try {
                            audioElement.currentTime = startTime;
                        } catch (e) {}
                    }
                    audioElement.removeEventListener('loadedmetadata', applyTime);
                };

                if (audioElement.readyState >= 1) {
                    applyTime();
                } else {
                    audioElement.addEventListener('loadedmetadata', applyTime);
                }
            }

            function stopAllMedia() {
                stopSynthLoop();
                clearInterval(fadeInterval);
                bgAudio.pause();
            }

            function playStageMedia(stage, useCrossfade = false) {
                stopSynthLoop();
                clearInterval(fadeInterval);

                const isCelebration = stage === 'celebration';
                const trackSrc = (isCelebration ? CONFIG.audio?.celebrationTrack : CONFIG.audio?.readingTrack || "").trim();
                const startTime = isCelebration ? (CONFIG.audio?.celebrationStartTime || 0) : (CONFIG.audio?.readingStartTime || 0);
                const targetVolume = CONFIG.audio?.volume ?? 0.65;

                if (!trackSrc) {
                    startSynthLoop(stage);
                    return;
                }

                const loadAndPlay = () => {
                    const currentAttrSrc = bgAudio.getAttribute('src') || "";
                    if (currentAttrSrc !== trackSrc) {
                        bgAudio.setAttribute('src', trackSrc);
                        bgAudio.load();
                    }

                    setAudioStartTime(bgAudio, startTime);
                    bgAudio.volume = useCrossfade ? 0.05 : targetVolume;

                    bgAudio.play().then(() => {
                        playing = true;
                        updateUI();

                        if (useCrossfade) {
                            fadeInterval = setInterval(() => {
                                if (bgAudio.volume < targetVolume - 0.05) {
                                    bgAudio.volume = Math.min(targetVolume, bgAudio.volume + 0.05);
                                } else {
                                    bgAudio.volume = targetVolume;
                                    clearInterval(fadeInterval);
                                }
                            }, 60);
                        }
                    }).catch((err) => {
                        console.warn("Không tìm thấy hoặc không thể phát file MP3, chuyển sang nhạc dự phòng:", err);
                        startSynthLoop(stage);
                    });
                };

                if (useCrossfade && !bgAudio.paused) {
                    fadeInterval = setInterval(() => {
                        if (bgAudio.volume > 0.08) {
                            bgAudio.volume = Math.max(0, bgAudio.volume - 0.08);
                        } else {
                            clearInterval(fadeInterval);
                            loadAndPlay();
                        }
                    }, 45);
                } else {
                    loadAndPlay();
                }
            }

            function showToast(message) {
                if (!els.musicStageToast) return;
                els.musicStageToast.textContent = message;
                els.musicStageToast.classList.add('is-visible');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    els.musicStageToast.classList.remove('is-visible');
                }, 3200);
            }

            function updateUI() {
                els.musicToggle.classList.toggle('is-playing', playing);
                els.musicToggle.setAttribute('aria-pressed', String(playing));
                if (!playing) {
                    els.musicLabel.textContent = '🔇 Nhạc nền: Tắt';
                } else {
                    els.musicLabel.textContent = currentStage === 'celebration'
                        ? '🎵 Nhạc: Hạnh phúc ♡'
                        : '🎵 Nhạc: Đọc thư';
                }
            }

            function startFromUserGesture(stage) {
                currentStage = stage || currentStage;
                playing = true;
                updateUI();
                playStageMedia(currentStage, false);
                showToast(currentStage === 'celebration' ? '✨ Đã chuyển sang giai điệu Hạnh phúc' : '🎶 Giai điệu mở thư đang phát...');
            }

            function switchStage(newStage) {
                currentStage = newStage;
                if (newStage === 'celebration') {
                    playCelebrationChime();
                }
                // Tự động bật hoặc chuyển sang đoạn điệp khúc giây 45 khi bấm Đồng ý
                playing = true;
                noteStep = 0;
                updateUI();
                playStageMedia(newStage, true);
                showToast('✨ LOVE!');
            }

            function toggle() {
                if (playing) {
                    playing = false;
                    stopAllMedia();
                    updateUI();
                    showToast('🔇 Đã tạm dừng nhạc nền');
                    return;
                }
                startFromUserGesture(AppState.current === 'celebration' ? 'celebration' : 'reading');
            }

            function playEnvelopeOpenSound() {
                initAudioContext();
                if (!audioCtx) return;
                playSynthNote(523.25, 0.9, 0.035, 'sine');
                setTimeout(() => playSynthNote(659.25, 1.2, 0.04, 'sine'), 120);
            }

            function playCelebrationChime() {
                initAudioContext();
                if (!audioCtx) return;
                const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                chord.forEach((freq, i) => {
                    setTimeout(() => playSynthNote(freq, 1.8, 0.06, 'sine'), i * 95);
                });
            }

            return {
                toggle,
                switchStage,
                startFromUserGesture,
                playEnvelopeOpenSound,
                playCelebrationChime,
                isPlaying: () => playing
            };
        })();

        /* ==========================================================================
           9. KHỞI CHẠY SỰ KIỆN KHI TRANG TẢI XONG
           ========================================================================== */
        window.addEventListener('DOMContentLoaded', () => {
            initContent();
            AmbientFX.init();
            setupNoButtonInteractions();

            // Mở phong bì bằng chuột, chạm cảm ứng hoặc phím Enter / Space
            els.envelopeTrigger.addEventListener('click', handleEnvelopeOpen);
            els.envelopeTrigger.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    handleEnvelopeOpen();
                }
            });

            // Nút hiện toàn bộ thư ngay lập tức
            els.skipRevealBtn.addEventListener('click', completeLetterRevealImmediately);

            // Nút "Đồng ý ❤️"
            els.btnYes.addEventListener('click', handleYesClick);

            // Nút Bật/Tắt nhạc nền
            els.musicToggle.addEventListener('click', SoundController.toggle);
        });
    </script>
